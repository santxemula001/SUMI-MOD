name: Build Sumi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - experimental

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6" "ndk;29.0.13113456"

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;29.0.13113456"

      - name: Setup Vulkan
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.224.1
          vulkan-components: Glslang
          vulkan-use-cache: true

      - name: Bootstrap vcpkg
        run: ./externals/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleMainlineRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sumi-Mainline-Release
          path: src/android/app/build/outputs/apk/mainline/release/*.apk
          if-no-files-found: error
